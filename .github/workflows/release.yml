# Manual release: publishes every public workspace package not yet on npm, with provenance. Nothing runs on push.
#   gh workflow run release.yml -f dry_run=true
# Run it on the release tag (gh workflow run release.yml --ref v<version>): it publishes only when v<version> is at HEAD.
# Needs the repository secret NPM_TOKEN (npm granular access token, read and write on @agent-plexus). See RELEASING.md.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and list the tarballs without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags: publish-unpublished.mjs checks that v<version> is at HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Clean build (dependency order)
        run: node scripts/build-packages.mjs --clean
      - name: Typecheck
        run: npm run typecheck
      - name: Package tests
        run: npm run test:packages
      - name: Tarball contents
        run: npm pack --dry-run --workspaces
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: node scripts/publish-unpublished.mjs --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
